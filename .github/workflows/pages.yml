# Tests, then deploys public/ to GitHub Pages on every push to main (the
# same as the other Quadra apps). One-time setup: Settings -> Pages ->
# Source: GitHub Actions.
name: Deploy to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The shared kit (Shared-Proxy/kit), for the tests
        uses: actions/checkout@v4
        with:
          repository: JayPengX/Shared-Proxy
          path: .shared
          sparse-checkout: kit
      - run: ln -sfn .shared/kit .kit
      - name: Run tests
        run: npm test
      - name: Cache-bust every script, module and stylesheet
        run: node scripts/stamp-version.mjs ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
