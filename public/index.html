<body class="tab-map">
<div id="loading" data-title="Orbit Transit" data-cache="orbit-transit-"></div>
<!-- kit:boot: right after <div id="loading">. -->
<script>document.write('<script src="'+QUADRA_KIT.url('boot.js')+'"><\/script>')</script>

<header class="q-appbar">
  <div class="q-appbar-inner">
    <div class="q-brand">
      <img class="q-brand-logo" src="./favicon.svg" alt="" width="34" height="34" />
      <div class="q-brand-text">
        <h1 id="title">Orbit Transit</h1>
      </div>
    </div>
    <nav id="tabs" class="q-tabbar" aria-label="分頁"></nav>
    <div id="top-actions" class="q-actions"></div>
  </div>
</header>
<main id="main">
  <section id="panel-map" class="ot-panel ot-map-panel" role="tabpanel" aria-labelledby="tab-map">
    <div id="map" class="ot-map" aria-label="地圖"></div>
    <div id="map-chips" class="ot-map-chips"></div>
    <div class="ot-fabs">
      <button id="fab-layers" class="ot-fab" type="button" aria-label="圖層"></button>
      <button id="fab-locate" class="ot-fab" type="button" aria-label="我的位置"></button>
    </div>
    <!-- The one sheet over the map (Maps' model): search, the shelves, a result's card, a trip's plans. Never a dialog. -->
    <aside id="msheet" class="ot-msheet" aria-label="地圖">
      <div id="ms-head" class="ot-ms-head">
        <button id="ms-grab" class="ot-ms-grab" type="button" role="slider" aria-label="面板高度" aria-valuemin="0" aria-valuemax="2"><i></i></button>
        <div class="ot-ms-row">
          <form id="map-search" class="ot-search" role="search" autocomplete="off">
            <svg class="ot-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>
            <input id="q" type="search" enterkeyhint="search" placeholder="搜尋地點" aria-label="搜尋地點" />
            <button id="q-clear" class="ot-x" type="button" aria-label="清除" hidden>×</button>
          </form>
          <button id="q-cancel" class="ot-ms-act" type="button" hidden>取消</button>
        </div>
      </div>
      <div id="ms-body" class="ot-ms-body">
        <div id="home" class="ot-home"></div>
        <div id="results" class="ot-results" hidden></div>
        <div id="card" class="ot-card" hidden></div>
      </div>
    </aside>
    <div id="nav" class="ot-nav" hidden></div>
  </section>
  <section id="panel-go" class="ot-panel ot-scroll" role="tabpanel" aria-labelledby="tab-go" hidden></section>
  <section id="panel-times" class="ot-panel ot-scroll" role="tabpanel" aria-labelledby="tab-times" hidden>
    <div class="ot-page">
      <nav id="times-seg" class="q-seg ot-times-seg" aria-label="查時刻"><button type="button" data-view="train">火車</button><button type="button" data-view="bus">公車</button><button type="button" data-view="metro">捷運</button></nav>
      <div id="panel-train"></div>
      <div id="times-bus" hidden></div>
      <div id="panel-metro" class="ot-metro" hidden></div>
    </div>
  </section>
  <section id="panel-me" class="ot-panel ot-scroll" role="tabpanel" aria-labelledby="tab-me" hidden>
    <div id="me-main"></div>
  </section>
</main>
<!-- Navigating, shrunk or on another tab: the step you're on, a tap goes back (nav.mjs). -->
