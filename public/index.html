<!-- kit:head: where the app's stylesheets end, before any module. The kit
     comes from one place for every app (Shared-Proxy's GitHub Pages, same
     site as the apps), at the version this device last saw (quadra.kit, set
     by the kit's watchUpdates), so a change to the kit is one push to
     Shared-Proxy and every app has it the next time it's opened. -->
<script>!function(b,v,q,m,f,i){try{v=localStorage.getItem('quadra.kit')||''}catch(e){v=''}q=v?'?v='+encodeURIComponent(v):'';m={'#kit/':b};f=['quadra.mjs','logos.mjs','names.mjs','photos.mjs','catalog.mjs'];for(i=0;i<f.length;i++)m['#kit/'+f[i]]=b+f[i]+q;window.QUADRA_KIT={base:b,version:v,url:function(x){return b+x+q}};document.write('<script type="import'+'map">'+JSON.stringify({imports:m})+'<\/script><link rel="stylesheet" href="'+b+'quadra.css'+q+'"><link rel="modulepreload" href="'+b+'quadra.mjs'+q+'"><link rel="modulepreload" href="'+b+'brand.mjs'+q+'">')}('../Shared-Proxy/kit/')</script>
<!-- /kit:head -->
<link rel="stylesheet" href="./transit.css" />
</head>
<body class="tab-map">
<div id="loading" data-title="Orbit Transit" data-cache="orbit-transit-"></div>
<!-- kit:boot: right after <div id="loading">. -->
<script>document.write('<script src="'+QUADRA_KIT.url('boot.js')+'"><\/script>')</script>
<!-- /kit:boot -->
<header class="q-appbar">
  <div class="q-appbar-inner">
    <div class="q-brand">
      <img class="q-brand-logo" src="./favicon.svg" alt="" width="34" height="34" />
      <div class="q-brand-text">
        <h1 id="title">Orbit Transit</h1>
        <p id="status" class="q-status" aria-live="polite"></p>
      </div>
    </div>
    <form id="map-search" class="ot-search" role="search" autocomplete="off">
      <svg class="ot-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>
      <input id="q" type="search" enterkeyhint="search" placeholder="搜尋地點、車站、地址" aria-label="搜尋地點" />
      <button id="q-clear" class="ot-x" type="button" aria-label="清除" hidden>×</button>
    </form>
    <nav id="tabs" class="q-tabbar" aria-label="分頁"></nav>
    <div id="top-actions" class="q-actions"></div>
  </div>
</header>
<main id="main">
  <section id="panel-map" class="ot-panel ot-map-panel" role="tabpanel" aria-labelledby="tab-map">
    <div id="map" class="ot-map" aria-label="地圖"></div>
    <div id="map-chips" class="q-chips ot-map-chips"></div>
    <div id="results" class="ot-results" hidden></div>
    <div id="near-bikes" class="ot-nearbikes" hidden></div>
    <div class="ot-fabs">
      <button id="fab-layers" class="ot-fab" type="button" aria-label="圖層"></button>
      <button id="fab-locate" class="ot-fab" type="button" aria-label="我的位置"></button>
    </div>
    <div id="card" class="ot-card" hidden></div>
    <div id="nav" class="ot-nav" hidden></div>
  </section>
  <section id="panel-go" class="ot-panel ot-scroll" role="tabpanel" aria-labelledby="tab-go" hidden></section>
  <section id="panel-times" class="ot-panel ot-scroll" role="tabpanel" aria-labelledby="tab-times" hidden>
    <nav id="times-seg" class="q-chips ot-seg" aria-label="查時刻"><button class="q-chip" type="button" data-view="train">台鐵・高鐵</button><button class="q-chip" type="button" data-view="bus">公車</button></nav>
    <div id="panel-train"></div>
    <div id="times-bus" hidden></div>
  </section>
  <section id="panel-me" class="ot-panel ot-scroll" role="tabpanel" aria-labelledby="tab-me" hidden>
    <div id="me-main"></div>
    <div id="panel-metro" class="ot-metro-panel" hidden></div>
  </section>
</main>
<!-- Navigating, shrunk or on another tab: the step you're on, a tap goes back (nav.mjs). -->
<div id="nav-mini" class="ot-nav-mini"></div>
<script type="module" src="./app.mjs" onerror="window.__fxFail()"></script>
</body>
